
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventarios de Panaderías</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #493326;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
        }

        h1 {
            color: #8b4513;
        }

        .panaderia {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 14px 0;
            border: 1px solid #e7c9a9;
            border-radius: 12px;
            background: white;
            color: #493326;
            font-size: 18px;
            text-align: left;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <main>
        <h1>Inventarios de Panaderías</h1>
        <p>Selecciona una panadería para comenzar.</p>

        <button class="panaderia" type="button">
            🥖 Panadería Pizzan
        </button>

        <button class="panaderia" type="button">
            🥐 Panadería Alonso
        </button>
    </main>
</body>
</html>
