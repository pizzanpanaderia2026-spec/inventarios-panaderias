
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventarios de Panaderías</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #493326;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
        }

        h1 {
            color: #8b4513;
            text-align: center;
        }

        .subtitulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .panaderia {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 14px 0;
            border: 1px solid #e7c9a9;
            border-radius: 12px;
            background: white;
            color: #493326;
            font-size: 18px;
            text-align: left;
            cursor: pointer;
        }

        .panaderia:hover {
            background: #fff0dc;
        }

        #detalle {
            display: none;
            background: white;
            border: 1px solid #e7c9a9;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .volver {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #8b4513;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <h1>Inventarios de Panaderías</h1>
        <p class="subtitulo">Selecciona una panadería para comenzar.</p>

        <section id="lista">
            <button class="panaderia" onclick="abrirPanaderia('Panadería Pizzan')">
                🥖 Panadería Pizzan
            </button>

            <button class="panaderia" onclick="abrirPanaderia('Panadería Alonso')">
                🥐 Panadería Alonso
            </button>
        </section>

        <section id="detalle" style="display: none;">
            <button class="volver" onclick="volver()">← Volver</button>
            <h2 id="nombrePanaderia"></h2>
            <p>Ya estás dentro de esta panadería.</p>
            <p>En el siguiente paso construiremos aquí el inventario de productos.</p>
        </section>
    </main>

    <script>
        function abrirPanaderia(nombre) {
            document.getElementById("lista").style.display = "none";
            document.getElementById("detalle").style.display = "block";
            document.getElementById("nombrePanaderia").textContent = nombre;
        }

        function volver() {
            document.getElementById("detalle").style.display = "none";
            document.getElementById("lista").style.display = "block";
        }
    </script>
</body>
</html>
