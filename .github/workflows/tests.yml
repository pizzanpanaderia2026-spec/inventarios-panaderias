name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q main.py historial_archivos.py historial_reportes.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check application JavaScript syntax
        run: |
          node --check static/produccion.js
          node --check static/historial-interfaz.js
          node --check static/productos.js
          node --check static/ventas.js
