name: Validación básica

on:
  push:
    branches:
      - feature/inventario-completo
  pull_request:
    branches:
      - main
      - feature/inventario-completo

jobs:
  validacion-estatica:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias Python
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Comprobar sintaxis de Python
        run: python -m compileall -q main.py tests
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Comprobar sintaxis de JavaScript
        run: |
          node --check static/productos.js
          node --check static/registro.js
          node --check static/tablas.js
      - name: Verificar archivos web esenciales
        run: |
          test -s static/index.html
          test -s static/productos.js
          test -s static/registro.js
          test -s static/tablas.js
          test -s supabase/migrations/202610260001_cierres_y_auditoria.sql
          test -s supabase/migrations/202610260002_cierre_reapertura_atomicos.sql
          test -s supabase/migrations/202610260003_restringir_funcion_rls_auto_enable.sql
      - name: Verificar delimitadores y permisos de SQL
        run: |
          grep -Fq 'as $' supabase/migrations/202610260001_cierres_y_auditoria.sql
          grep -Fq '$;' supabase/migrations/202610260001_cierres_y_auditoria.sql
          grep -Fq 'revoke execute on function public.rls_auto_enable() from public, anon, authenticated;' supabase/migrations/202610260003_restringir_funcion_rls_auto_enable.sql
